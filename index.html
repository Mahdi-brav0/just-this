<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="تینا">
<meta property="og:description" content="یک پیام کوچک">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تینا">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='26' fill='%23170a11'/><circle cx='60' cy='60' r='22' fill='%23cda45e'/></svg>">
<meta name="theme-color" content="#120610">
<title>برای تینا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%23cda45e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #120610;
    --bg: #23101a;
    --ink: #f7ecdd;
    --ink-muted: #c7a596;
    --gold: #cda45e;
    --gold-bright: #f2dca6;
    --rose: #a5636f;
    --line: rgba(247, 236, 221, 0.14);
    --mx: 50%;
    --my: 42%;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body{ height: 100%; overscroll-behavior: none; }
  html{ touch-action: manipulation; }
  body, main.card, .gate{ -webkit-user-select: none; user-select: none; }

  body{
    margin: 0;
    color: var(--ink);
    font-family: 'Vazirmatn', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
    overflow: hidden;
    position: relative;
    background: var(--bg-deep);
    min-height: 100vh;
    min-height: 100dvh;
    touch-action: manipulation;
  }

  canvas#fx{ position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  .halo{
    position: fixed;
    width: 340px; height: 340px;
    border-radius: 50%;
    left: 0; top: 0;
    background: radial-gradient(circle, rgba(242,220,166,0.10), rgba(242,220,166,0) 70%);
    transform: translate(-50%,-50%);
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .field{
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 55% 45% at var(--mx) var(--my), rgba(205,164,94,0.14), transparent 62%),
      radial-gradient(ellipse 60% 40% at 82% 88%, rgba(165,99,111,0.16), transparent 60%),
      radial-gradient(ellipse 50% 40% at 8% 92%, rgba(205,164,94,0.05), transparent 60%),
      var(--bg-deep);
    transition: background 0.6s ease-out;
  }

  .grain{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.05; mix-blend-mode: normal;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .vignette{ position: fixed; inset: 0; z-index: 1; pointer-events: none; box-shadow: inset 0 0 18vw 2vw rgba(10,4,8,0.6); }

  .motes{ position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

  .mote{
    position: absolute; bottom: -8%; border-radius: 50%;
    background: radial-gradient(circle, rgba(242,220,166,0.9), rgba(242,220,166,0) 70%);
    filter: blur(0.5px); opacity: 0;
    animation-name: float-up; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }

  @keyframes float-up{
    0%{ opacity: 0; transform: translateY(0) translateX(0); }
    12%{ opacity: 0.85; }
    50%{ transform: translateY(-48vh) translateX(var(--drift, 12px)); }
    88%{ opacity: 0.5; }
    100%{ opacity: 0; transform: translateY(-92vh) translateX(calc(var(--drift, 12px) * -1)); }
  }

  /* ---------- Gate ---------- */

  .gate{
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg-deep);
    transition: opacity 1.1s cubic-bezier(0.4,0,0.2,1), visibility 1.1s;
  }

  .gate.hidden{ opacity: 0; visibility: hidden; pointer-events: none; }

  .dot-wrap{ position: relative; width: 60px; height: 60px; margin-bottom: 28px; }

  .pulse-dot{
    position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold-bright); transform: translate(-50%,-50%);
    box-shadow: 0 0 24px 6px rgba(242,220,166,0.5);
    animation: dot-breathe 2.6s ease-in-out infinite;
  }

  @keyframes dot-breathe{
    0%, 100%{ transform: translate(-50%,-50%) scale(1); opacity: 0.75; }
    50%{ transform: translate(-50%,-50%) scale(1.5); opacity: 1; }
  }

  .orbit{
    position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold); opacity: 0.7;
    animation: orbit-spin linear infinite;
  }
  .orbit.o1{ animation-duration: 5s; box-shadow: 0 0 6px rgba(205,164,94,0.7); }
  .orbit.o2{ animation-duration: 8s; animation-direction: reverse; opacity: 0.4; }

  @keyframes orbit-spin{
    from{ transform: translate(-50%,-50%) rotate(0deg) translateX(26px) rotate(0deg); }
    to{ transform: translate(-50%,-50%) rotate(360deg) translateX(26px) rotate(-360deg); }
  }

  .gate p.hint{ color: var(--ink-muted); font-size: 1.1rem; font-weight: 400; margin: 0 0 8px; letter-spacing: 0.03em; }
  .gate p.hint-sub{
    color: var(--gold); font-size: 0.9rem; font-weight: 300; margin: 0; opacity: 0.75;
    animation: hint-fade 2.4s ease-in-out 1.5s infinite;
  }
  @keyframes hint-fade{ 0%, 100%{ opacity: 0.4; } 50%{ opacity: 0.85; } }

  /* ---------- Card ---------- */

  main.card{
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 64px 56px; max-width: 620px; width: 100%;
    border: 1px solid var(--line); border-radius: 2px;
    background: linear-gradient(180deg, rgba(247,236,221,0.025), rgba(247,236,221,0.01));
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.65);
  }

  .ring{
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--gold); transform: translate(-50%,-50%) scale(0.3);
    opacity: 0; pointer-events: none;
  }

  .opened .ring.intro{ animation: ring-pulse 2s cubic-bezier(0.2,0.7,0.3,1) forwards; }
  .opened .ring.intro.r2{ animation-delay: 0.25s; }
  .ring.echo{ animation: ring-pulse 1.4s cubic-bezier(0.2,0.7,0.3,1) forwards; }

  @keyframes ring-pulse{
    0%{ transform: translate(-50%,-50%) scale(0.3); opacity: 0.9; }
    100%{ transform: translate(-50%,-50%) scale(7); opacity: 0; }
  }

  p.eyebrow{ color: var(--ink-muted); font-size: 1rem; font-weight: 400; letter-spacing: 0.04em; margin: 0 0 22px; opacity: 0; }
  .opened p.eyebrow{ animation: rise 1s ease-out 0.3s forwards; }

  .hairline{ width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 0 30px; }
  .opened .hairline{ animation: draw 1.1s ease-out 0.7s forwards; }
  @keyframes draw{ from{ width: 0; opacity: 0; } to{ width: 84px; opacity: 1; } }

  .heart-wrap{ position: relative; cursor: pointer; padding: 18px 28px; margin: -18px -28px; }

  h1{
    position: relative;
    font-size: clamp(2.9rem, 11vw, 5.4rem); font-weight: 700; margin: 0;
    color: var(--gold-bright); letter-spacing: 0.3em; line-height: 1.15;
    white-space: nowrap;
    opacity: 0; filter: blur(6px);
    background: linear-gradient(115deg, var(--gold-bright) 40%, #fff 50%, var(--gold-bright) 60%);
    background-size: 300% 100%;
    background-position: 200% 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .opened h1{
    animation: reveal-word 1.5s cubic-bezier(0.16,1,0.3,1) 1s forwards,
               breathe 5.5s ease-in-out 2.8s infinite,
               shimmer 7s ease-in-out 4s infinite;
  }

  @keyframes reveal-word{
    0%{ opacity: 0; letter-spacing: 0.55em; filter: blur(6px); transform: translateY(10px); }
    100%{ opacity: 1; letter-spacing: 0em; filter: blur(0); transform: translateY(0); }
  }
  @keyframes breathe{
    0%, 100%{ text-shadow: 0 0 26px rgba(205,164,94,0.28); }
    50%{ text-shadow: 0 0 46px rgba(242,220,166,0.5); }
  }
  @keyframes shimmer{
    0%, 82%{ background-position: 200% 0; }
    92%{ background-position: -60% 0; }
    100%{ background-position: -60% 0; }
  }

  .underline{ width: 0; height: 1px; background: var(--rose); margin: 26px 0 0; opacity: 0; }
  .opened .underline{ animation: draw-rose 1s ease-out 2.5s forwards; }
  @keyframes draw-rose{ from{ width: 0; opacity: 0; } to{ width: 46px; opacity: 0.7; } }

  p.sub{ margin: 26px 0 0; color: var(--rose); font-size: 1.05rem; font-weight: 400; letter-spacing: 0.02em; opacity: 0; }
  .opened p.sub{ animation: rise 1.1s ease-out 2.7s forwards; }

  @keyframes rise{ from{ opacity: 0; transform: translateY(12px); } to{ opacity: 1; transform: translateY(0); } }

  .sound-toggle{
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    inset-inline-end: max(18px, env(safe-area-inset-right));
    z-index: 11;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(23,10,17,0.4);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.8s ease 3.2s, border-color 0.3s ease;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .opened .sound-toggle{ opacity: 0.65; }
  .sound-toggle:hover, .sound-toggle:focus-visible{ opacity: 1 !important; border-color: var(--gold); }
  .sound-toggle svg{ width: 16px; height: 16px; }

  @media (max-width: 480px){ main.card{ padding: 48px 26px; } }

  @media (hover: none){ .halo{ display: none; } main.card{ backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(35,16,26,0.55); } }

  @media (prefers-reduced-motion: reduce){
    .gate{ display: none !important; }
    .halo{ display: none !important; }
    main.card *{ animation: none !important; opacity: 1 !important; filter: none !important; letter-spacing: normal !important; }
    h1{ letter-spacing: 0.15em !important; background-position: 0 0 !important; }
    .ring{ display: none; }
  }
</style>
</head>
<body>

  <canvas id="fx"></canvas>
  <div class="halo" id="halo"></div>
  <div class="field" id="field"></div>
  <div class="grain"></div>
  <div class="motes" id="motes"></div>
  <div class="vignette"></div>

  <button class="sound-toggle" id="soundToggle" aria-label="قطع یا وصل صدا" type="button">
    <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4,9 9,9 13,5 13,19 9,15 4,15"></polygon>
      <path d="M17 8c1.7 1.7 1.7 6.3 0 8"></path>
    </svg>
  </button>

  <div class="gate" id="gate" aria-hidden="true">
    <div class="dot-wrap">
      <div class="orbit o1"></div>
      <div class="orbit o2"></div>
      <div class="pulse-dot"></div>
    </div>
    <p class="hint">تینا</p>
  </div>

  <main class="card" id="card">
    <div class="ring intro r1"></div>
    <div class="ring intro r2"></div>
    <p class="eyebrow">تینا</p>
    <div class="hairline"></div>
    <div class="heart-wrap" id="heartWrap">
      <h1>دوستت دارم</h1>
    </div>
    <div class="underline"></div>
    <p class="sub">همین. همیشه.</p>
  </main>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gate = document.getElementById('gate');
  const card = document.getElementById('card');
  const motesEl = document.getElementById('motes');
  const field = document.getElementById('field');
  const halo = document.getElementById('halo');
  const heartWrap = document.getElementById('heartWrap');
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const soundToggle = document.getElementById('soundToggle');
  const soundIcon = document.getElementById('soundIcon');

  // ---------- soft synthesized chimes ----------
  let audioCtx = null;
  let muted = false;

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function chime(notes, volume){
    if(muted) return;
    const ac = ensureAudio();
    if(!ac) return;
    const master = ac.createGain();
    master.gain.value = volume;
    master.connect(ac.destination);

    notes.forEach(({ freq, start, dur }) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2600;
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = ac.currentTime + start;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(1, t0 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    });
  }

  function chimeOpen(){
    chime([
      { freq: 523.25, start: 0, dur: 1.6 },
      { freq: 659.25, start: 0.14, dur: 1.6 },
      { freq: 783.99, start: 0.30, dur: 1.9 }
    ], 0.16);
  }

  function chimeEcho(){
    chime([{ freq: 659.25, start: 0, dur: 1.1 }, { freq: 987.77, start: 0.06, dur: 1.2 }], 0.11);
  }

  soundToggle.addEventListener('click', () => {
    muted = !muted;
    soundIcon.innerHTML = muted
      ? '<polygon points="4,9 9,9 13,5 13,19 9,15 4,15"></polygon><line x1="16" y1="9" x2="21" y2="14"></line><line x1="21" y1="9" x2="16" y2="14"></line>'
      : '<polygon points="4,9 9,9 13,5 13,19 9,15 4,15"></polygon><path d="M17 8c1.7 1.7 1.7 6.3 0 8"></path>';
    ensureAudio();
  });

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  const isTouch = matchMedia('(hover: none)').matches;
  const MAX_PARTICLES = isTouch ? 160 : 320;

  const particles = [];
  function spawnParticle(x, y, opts = {}){
    if(particles.length >= MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES + 1);
    const warm = Math.random() > 0.4;
    particles.push({
      x, y,
      vx: opts.vx ?? (Math.random() - 0.5) * (opts.spread ?? 1.2),
      vy: opts.vy ?? (Math.random() - 0.5) * (opts.spread ?? 1.2) - (opts.rise ?? 0),
      life: 0,
      maxLife: opts.life ?? (40 + Math.random() * 30),
      size: opts.size ?? (1 + Math.random() * 2.2),
      color: warm ? '205,164,94' : '242,220,166'
    });
  }

  function burst(x, y, count){
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 4.5;
      spawnParticle(x, y, {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 50 + Math.random() * 40,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy = p.vy * 0.97 - 0.01;
      const t = p.life / p.maxLife;
      if(t >= 1){ particles.splice(i, 1); continue; }
      const alpha = Math.sin((1 - t) * Math.PI * 0.5) * 0.85;
      const r = p.size * (1 - t * 0.3);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${alpha * 0.22})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  if(!reduceMotion) requestAnimationFrame(tick);

  function spawnMotes(){
    const count = 16;
    for(let i = 0; i < count; i++){
      const m = document.createElement('div');
      m.className = 'mote';
      const size = 2 + Math.random() * 3.5;
      m.style.width = size + 'px';
      m.style.height = size + 'px';
      m.style.left = (Math.random() * 100) + 'vw';
      m.style.setProperty('--drift', (Math.random() * 40 - 20) + 'px');
      const duration = 9 + Math.random() * 10;
      m.style.animationDuration = duration + 's';
      m.style.animationDelay = (Math.random() * duration) + 's';
      motesEl.appendChild(m);
    }
  }

  // soft trailing halo that eases toward the pointer — also drives the
  // background glow, both updated once per animation frame (not per raw event)
  let haloX = window.innerWidth / 2, haloY = window.innerHeight / 2;
  let targetX = haloX, targetY = haloY;
  function haloLoop(){
    haloX += (targetX - haloX) * 0.08;
    haloY += (targetY - haloY) * 0.08;
    halo.style.transform = `translate(${haloX}px, ${haloY}px) translate(-50%,-50%)`;
    field.style.setProperty('--mx', (haloX / window.innerWidth) * 100 + '%');
    field.style.setProperty('--my', (haloY / window.innerHeight) * 100 + '%');
    requestAnimationFrame(haloLoop);
  }

  let opened = false;
  function openGate(clientX, clientY){
    if(opened) return;
    opened = true;
    gate.classList.add('hidden');
    document.body.classList.add('opened');
    ensureAudio();
    chimeOpen();
    enableTilt();
    if(!reduceMotion){
      burst(clientX, clientY, 90);
      spawnMotes();
      halo.style.opacity = '1';
      targetX = clientX; targetY = clientY; haloX = clientX; haloY = clientY;
      requestAnimationFrame(haloLoop);
      window.addEventListener('pointermove', onPointerMove, { passive: true });
    }
  }

  function enableTilt(){
    if(reduceMotion || typeof DeviceOrientationEvent === 'undefined') return;
    const apply = (e) => {
      if(e.gamma === null || e.beta === null) return;
      const gx = Math.max(-30, Math.min(30, e.gamma)) / 30;
      const gy = Math.max(-20, Math.min(20, (e.beta || 0) - 45)) / 20;
      targetX = (0.5 + gx * 0.3) * window.innerWidth;
      targetY = (0.4 + gy * 0.3) * window.innerHeight;
    };
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then((state) => {
        if(state === 'granted') window.addEventListener('deviceorientation', apply, { passive: true });
      }).catch(() => {});
    } else {
      window.addEventListener('deviceorientation', apply, { passive: true });
    }
  }

  let lastSparkle = 0;
  function onPointerMove(e){
    targetX = e.clientX; targetY = e.clientY;
    const now = performance.now();
    if(now - lastSparkle > 45 && Math.random() > 0.5){
      lastSparkle = now;
      spawnParticle(e.clientX, e.clientY, { spread: 0.6, rise: 0.6, life: 35 + Math.random() * 20, size: 0.8 + Math.random() * 1.6 });
    }
  }

  // ---------- keep the heading on one line on every phone ----------
  const headingEl = card.querySelector('h1');
  function fitHeading(){
    const available = heartWrap.clientWidth * 0.94;
    if(!available) return;
    const probe = headingEl.cloneNode(true);
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'nowrap';
    probe.style.letterSpacing = '0';
    probe.style.filter = 'none';
    probe.style.left = '-9999px';
    probe.style.fontSize = getComputedStyle(headingEl).fontSize;
    document.body.appendChild(probe);
    let size = parseFloat(probe.style.fontSize);
    const minSize = 26;
    while(probe.getBoundingClientRect().width > available && size > minSize){
      size -= 1;
      probe.style.fontSize = size + 'px';
    }
    headingEl.style.fontSize = size + 'px';
    document.body.removeChild(probe);
  }
  fitHeading();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeading);
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitHeading, 120); });
  window.addEventListener('orientationchange', () => setTimeout(fitHeading, 200));

  gate.addEventListener('click', (e) => { clearTimeout(autoOpenTimer); openGate(e.clientX, e.clientY); });
  gate.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      clearTimeout(autoOpenTimer);
      openGate(window.innerWidth / 2, window.innerHeight / 2);
    }
  });

  // opens on its own — no tap needed. A brief breathing moment first, then it unfolds.
  const autoOpenTimer = setTimeout(() => {
    openGate(window.innerWidth / 2, window.innerHeight / 2);
  }, 1600);

  // tapping the words again after opening: a small replayable echo
  let lastEcho = 0;
  heartWrap.addEventListener('click', () => {
    if(!opened || reduceMotion) return;
    const now = Date.now();
    if(now - lastEcho < 500) return;
    lastEcho = now;
    const rect = heartWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    burst(cx, cy, 40);
    chimeEcho();
    const echo = document.createElement('div');
    echo.className = 'ring echo';
    heartWrap.appendChild(echo);
    setTimeout(() => echo.remove(), 1500);
  });

  if(reduceMotion){
    openGate(window.innerWidth / 2, window.innerHeight / 2);
  }
</script>

</body>
</html>
